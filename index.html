<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask My PDF</title>

  <style>
    /* ---------- light theme tokens ---------- */
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --line: #e3e6ea;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ok: #16a34a;
      --err: #dc2626;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 18px 60px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }

    .sub {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ---------- cards ---------- */
    .card {
      margin-bottom: 18px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    /* ---------- inputs + buttons ---------- */
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .row > input[type="text"] {
      flex: 1;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* ---------- status + answer ---------- */
    .status {
      min-height: 18px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .status.ok  { color: var(--ok); }
    .status.err { color: var(--err); }

    #answer {
      min-height: 24px;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafbfc;
      line-height: 1.55;
      font-size: 14.5px;
      white-space: pre-wrap;   /* keep the model's line breaks */
    }

    #answer:empty {
      display: none;
    }

    /* ---------- API base config ---------- */
    .cfg {
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--muted);
    }

    .cfg input {
      width: 230px;
      padding: 5px 8px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Ask My PDF</h1>
    <div class="sub">Upload a PDF, then ask questions about it.</div>

    <!-- API base URL -->
    <div class="cfg">
      API base: <input id="api" type="text" value="http://127.0.0.1:8000" />
    </div>

    <!-- step 1: upload -->
    <div class="card">
      <h2>1 · Upload PDF</h2>
      <div class="row">
        <input id="file" type="file" accept="application/pdf" />
        <button id="uploadBtn">Upload</button>
      </div>
      <div class="status" id="uploadStatus"></div>
    </div>

    <!-- step 2: ask -->
    <div class="card">
      <h2>2 · Ask</h2>
      <div class="row">
        <input id="query" type="text" placeholder="e.g. who created spider-man" />
        <button id="askBtn">Ask</button>
      </div>
      <div class="status" id="askStatus"></div>
      <div id="answer"></div>
    </div>
  </div>

  <script>
    // shorthand for document.getElementById
    const byId = (id) => document.getElementById(id);

    // current API base, without a trailing slash
    const apiBase = () => byId("api").value.replace(/\/+$/, "");

    // set a status line with an optional ok/err colour
    function setStatus(el, text, cls) {
      el.textContent = text;
      el.className = "status " + (cls || "");
    }

    // -------------------------------------------------------------------
    // upload:  POST /upload  (multipart form, field name must be "file")
    // -------------------------------------------------------------------
    byId("uploadBtn").onclick = async () => {
      const file = byId("file").files[0];
      if (!file) {
        setStatus(byId("uploadStatus"), "Pick a PDF first.", "err");
        return;
      }

      const form = new FormData();
      form.append("file", file);          // "file" matches the FastAPI parameter

      byId("uploadBtn").disabled = true;
      setStatus(byId("uploadStatus"), "Uploading & embedding…");

      try {
        const res = await fetch(`${apiBase()}/upload`, { method: "POST", body: form });
        if (!res.ok) throw new Error(await errorText(res));
        setStatus(byId("uploadStatus"), "✓ " + (await res.text()), "ok");
      } catch (err) {
        setStatus(byId("uploadStatus"), "Error: " + friendlyError(err), "err");
      } finally {
        byId("uploadBtn").disabled = false;
      }
    };

    // -------------------------------------------------------------------
    // ask:  POST /ask  {"query": "..."}  (response streams as text/plain)
    // -------------------------------------------------------------------
    byId("askBtn").onclick = async () => {
      const question = byId("query").value.trim();
      if (!question) {
        setStatus(byId("askStatus"), "Type a question.", "err");
        return;
      }

      byId("askBtn").disabled = true;
      setStatus(byId("askStatus"), "Thinking…");
      byId("answer").textContent = "";

      try {
        const res = await fetch(`${apiBase()}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: question }),
        });
        if (!res.ok) throw new Error(await errorText(res));

        // read the streamed body chunk by chunk
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          byId("answer").textContent += decoder.decode(value, { stream: true });
        }
        setStatus(byId("askStatus"), "✓ done", "ok");
      } catch (err) {
        setStatus(byId("askStatus"), "Error: " + friendlyError(err), "err");
      } finally {
        byId("askBtn").disabled = false;
      }
    };

    // pull the message out of FastAPI's {"detail": ...} error body
    async function errorText(res) {
      const raw = await res.text();
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed.detail === "string") return parsed.detail;
        if (Array.isArray(parsed.detail)) {
          return parsed.detail.map((d) => d.msg || String(d)).join("; ");
        }
      } catch {
        /* not JSON - fall through to the raw body */
      }
      return raw;
    }

    // turn raw fetch errors into something readable
    function friendlyError(err) {
      const message = (err && err.message) || String(err);
      if (/Failed to fetch|NetworkError/i.test(message)) {
        return "Can't reach the API. Is the server running, and CORS enabled?";
      }
      return message;
    }

    // Enter in the query box triggers Ask
    byId("query").addEventListener("keydown", (e) => {
      if (e.key === "Enter") byId("askBtn").click();
    });
  </script>
</body>
</html>
