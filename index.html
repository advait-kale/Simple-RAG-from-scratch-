<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ask My PDF</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#151823; --panel2:#1c2030; --line:#272c3b;
    --txt:#eaedf5; --muted:#9aa3b8; --accent:#7c9cff; --accent2:#5d7bff;
    --user:#2a3350; --bot:#1c2030; --ok:#4ad295; --err:#ff7a7a;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, #18203a 0, transparent 60%),
      var(--bg);
    color:var(--txt);
    display:flex; flex-direction:column; height:100vh;
  }
  /* header */
  header{
    padding:16px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; background:rgba(21,24,35,.6);
    backdrop-filter:blur(8px); position:sticky; top:0; z-index:5;
  }
  .logo{
    width:34px; height:34px; border-radius:10px; flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid; place-items:center; font-size:18px;
  }
  header h1{font-size:16px; margin:0; font-weight:650;}
  header .tag{font-size:12px; color:var(--muted); margin-top:1px;}
  header .spacer{flex:1;}
  .gear{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:6px;border-radius:8px;}
  .gear:hover{background:var(--panel2);color:var(--txt);}

  /* settings drawer */
  .settings{
    display:none; padding:10px 22px; border-bottom:1px solid var(--line);
    background:var(--panel); font-size:13px; color:var(--muted); align-items:center; gap:10px;
  }
  .settings.open{display:flex;}
  .settings input{background:#0e1016;border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:6px 10px;font-size:13px;width:260px;}

  /* upload strip */
  .uploader{padding:14px 22px; border-bottom:1px solid var(--line); background:var(--panel);}
  .drop{
    border:1.5px dashed var(--line); border-radius:var(--radius); padding:18px;
    display:flex; align-items:center; gap:14px; cursor:pointer; transition:.15s;
  }
  .drop:hover,.drop.drag{border-color:var(--accent); background:var(--panel2);}
  .drop .ic{font-size:26px;}
  .drop .t{font-size:14px; font-weight:600;}
  .drop .s{font-size:12px; color:var(--muted); margin-top:2px;}
  .drop .pill{margin-left:auto; font-size:12px; padding:6px 12px; border-radius:20px;
    background:var(--panel2); color:var(--muted);}
  .drop .pill.ok{color:var(--ok);} .drop .pill.err{color:var(--err);} .drop .pill.busy{color:var(--accent);}

  /* chat */
  .chat{flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:16px;}
  .empty{margin:auto; text-align:center; color:var(--muted); max-width:340px;}
  .empty .big{font-size:34px; margin-bottom:8px;}
  .empty .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px;}
  .chip{font-size:12.5px; padding:8px 12px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel); color:var(--txt); cursor:pointer;}
  .chip:hover{border-color:var(--accent);}

  .msg{display:flex; gap:10px; max-width:84%; animation:rise .2s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .msg .av{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:15px;}
  .msg .bubble{padding:11px 14px; border-radius:14px; line-height:1.55; font-size:14.5px; white-space:pre-wrap;}
  .msg.user{align-self:flex-end; flex-direction:row-reverse;}
  .msg.user .av{background:var(--user);}
  .msg.user .bubble{background:var(--user); border-bottom-right-radius:4px;}
  .msg.bot .av{background:linear-gradient(135deg,var(--accent),var(--accent2));}
  .msg.bot .bubble{background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .typing{display:inline-flex; gap:4px; padding:4px 2px;}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.25;} 30%{opacity:1;}}

  /* composer */
  .composer{padding:14px 22px 20px; border-top:1px solid var(--line); background:var(--panel);}
  .bar{display:flex; gap:10px; align-items:flex-end; background:#0e1016; border:1px solid var(--line);
    border-radius:14px; padding:8px 8px 8px 14px;}
  .bar textarea{flex:1; resize:none; border:none; background:none; color:var(--txt); font-size:15px;
    font-family:inherit; max-height:140px; padding:6px 0; outline:none;}
  .send{width:40px;height:40px;border:none;border-radius:11px;flex:none;cursor:pointer;color:#fff;font-size:17px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));}
  .send:disabled{opacity:.4;cursor:not-allowed;}
  .hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;}
</style>
</head>
<body>
  <header>
    <div class="logo">📄</div>
    <div>
      <h1>Ask My PDF</h1>
      <div class="tag">drop a document, then chat with it</div>
    </div>
    <div class="spacer"></div>
    <button class="gear" id="gear" title="Settings">⚙️</button>
  </header>

  <div class="settings" id="settings">
    API base
    <input id="api" type="text" value="http://127.0.0.1:8000" />
    <span id="apiState">●</span>
  </div>

  <!-- upload -->
  <div class="uploader">
    <label class="drop" id="drop">
      <input id="file" type="file" accept="application/pdf" hidden />
      <div class="ic">⬆️</div>
      <div>
        <div class="t" id="dropTitle">Drop a PDF here, or click to choose</div>
        <div class="s" id="dropSub">It gets read, chunked and embedded so you can ask about it.</div>
      </div>
      <div class="pill" id="upPill">no file yet</div>
    </label>
  </div>

  <!-- chat -->
  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <div class="big">💬</div>
      <div>Upload a PDF and ask me anything about it.<br/>I only answer from what's in the document.</div>
      <div class="chips" id="chips">
        <div class="chip">Summarise this document</div>
        <div class="chip">What are the key points?</div>
        <div class="chip">Who created spider-man</div>
      </div>
    </div>
  </div>

  <!-- composer -->
  <div class="composer">
    <div class="bar">
      <textarea id="query" rows="1" placeholder="Ask something about your PDF…"></textarea>
      <button class="send" id="send" title="Send">➤</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const apiBase = () => $("api").value.replace(/\/+$/, "");

  // settings toggle
  $("gear").onclick = () => $("settings").classList.toggle("open");

  // ---------- upload ----------
  const drop = $("drop"), fileInput = $("file"), upPill = $("upPill");
  drop.addEventListener("dragover", (e)=>{e.preventDefault(); drop.classList.add("drag");});
  drop.addEventListener("dragleave", ()=>drop.classList.remove("drag"));
  drop.addEventListener("drop", (e)=>{
    e.preventDefault(); drop.classList.remove("drag");
    if (e.dataTransfer.files[0]) { fileInput.files = e.dataTransfer.files; uploadFile(); }
  });
  fileInput.addEventListener("change", uploadFile);

  async function uploadFile(){
    const f = fileInput.files[0];
    if (!f) return;
    if (!f.name.toLowerCase().endsWith(".pdf")) { setPill("not a PDF", "err"); return; }

    $("dropTitle").textContent = f.name;
    $("dropSub").textContent = (f.size/1024).toFixed(0) + " KB · reading & embedding…";
    setPill("uploading…", "busy");

    const fd = new FormData();
    fd.append("file", f);                       // matches FastAPI param "file"
    try{
      const res = await fetch(`${apiBase()}/upload`, { method:"POST", body:fd });
      const text = await res.text();
      if(!res.ok) throw new Error(text);
      setPill("ready ✓", "ok");
      $("dropSub").textContent = "Embedded. Ask away below.";
    }catch(e){
      setPill("failed", "err");
      $("dropSub").textContent = friendlyError(e);
    }
  }
  function setPill(t, cls){ upPill.textContent = t; upPill.className = "pill " + (cls||""); }

  // ---------- chat ----------
  const chat = $("chat");
  function clearEmpty(){ const e=$("empty"); if(e) e.remove(); }

  function addMsg(role, text){
    clearEmpty();
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    wrap.innerHTML = `<div class="av">${role==="user"?"🧑":"🤖"}</div><div class="bubble"></div>`;
    wrap.querySelector(".bubble").textContent = text;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap.querySelector(".bubble");
  }
  function typingBubble(){
    clearEmpty();
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.innerHTML = `<div class="av">🤖</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap.querySelector(".bubble");
  }

  async function ask(){
    const q = $("query").value.trim();
    if(!q) return;
    addMsg("user", q);
    $("query").value = ""; autoSize();
    $("send").disabled = true;

    const bubble = typingBubble();
    let first = true;
    try{
      const url = `${apiBase()}/ask?query=${encodeURIComponent(q)}`;
      const res = await fetch(url, { method:"POST" });
      if(!res.ok) throw new Error(await res.text());

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        if(first){ bubble.textContent = ""; first = false; }   // drop the typing dots
        bubble.textContent += dec.decode(value, { stream:true });
        chat.scrollTop = chat.scrollHeight;
      }
      if(first) bubble.textContent = "(no answer)";
    }catch(e){
      bubble.textContent = "⚠ " + friendlyError(e);
    }finally{
      $("send").disabled = false;
      $("query").focus();
    }
  }

  function friendlyError(e){
    const m = (e && e.message) || String(e);
    if(/Failed to fetch|NetworkError/i.test(m))
      return "Can't reach the API. Is the server running, and CORS enabled?";
    return m;
  }

  // chips fill the box
  $("chips")?.addEventListener("click", (e)=>{
    if(e.target.classList.contains("chip")){ $("query").value = e.target.textContent; $("query").focus(); autoSize(); }
  });

  // composer behaviour
  $("send").onclick = ask;
  const ta = $("query");
  function autoSize(){ ta.style.height="auto"; ta.style.height = Math.min(ta.scrollHeight,140)+"px"; }
  ta.addEventListener("input", autoSize);
  ta.addEventListener("keydown",(e)=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ask(); }
  });
</script>
</body>
</html>
